  ego_data_v2_sqrt_frames:
    arctic: 10
    dexycb: 1
    egopro: 1
    egopro_body: 1
    egostandard: 1
    egostandard_body: 1
    egoverse: 1
    hot3d: 10
    h2o3d: 1
    ho3d: 1
save_final_checkpoint: true
stage1_loss_weight: 1.0
step_memory_enabled: true
step_memory_max_frames: 36
step_memory_scale_frames: 4
step_memory_sliding_window: 16
train_detection_modules_only: true
train_mano_modules_only: false
train_steps: 100000
trans_loss_weight: 0.0
warmup_steps: 10000
weight_decay: 0.01
wilor_cfg: /path/to/infinihand/third_party/WiLoR/pretrained_models/model_config.yaml
