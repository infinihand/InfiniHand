batch_size: 1
betas_loss_weight: 0.0
camera_joint_target_space: image_camera
checkpoint_interval: 5000
data_cache_mode: none
dataset_jsons:
- /path/to/data/manifests/train/arctic.json
- /path/to/data/manifests/train/dexycb.json
- /path/to/data/manifests/train/egopro.json
- /path/to/data/manifests/train/egopro_body.json
- /path/to/data/manifests/train/egostandard.json
- /path/to/data/manifests/train/egostandard_body.json
- /path/to/data/manifests/train/egoverse.json
- /path/to/data/manifests/train/hot3d.json
- /path/to/data/manifests/train/h2o3d.json
- /path/to/data/manifests/train/ho3d.json
dataset_len_train: 10000
dataset_retry_attempts: 8
