batch_size: 1
camera_joint_target_space: image_camera
checkpoint_interval: 5000
data_cache_mode: none
dataset_jsons:
- /path/to/data/manifests/train/arctic.json
- /path/to/data/manifests/train/egodemo_egopro_standard.json
- /path/to/data/manifests/train/egodemo_egostandard.json
- /path/to/data/manifests/train/h2o.json
- /path/to/data/manifests/train/hot3d.json
- /path/to/data/manifests/train/oakink2.json
dataset_len_train: 10000
dataset_retry_attempts: 8
dataset_sampling_version: ego_data_v2_sqrt_frames
ego3r_training_root: /path/to/infinihand/infinihand/training
finetune_checkpoint: ''
finetune_step_offset: 0
freeze_backbone: true
freeze_hand_feature_provider: false
freeze_wilor_backbone: false
get_batch_retry_attempts: 8
global_batch_size: 0
grad_clip_norm: 1
hand_bbox_giou_loss_weight: 0.0
hand_bbox_head_enabled: false
hand_bbox_smooth_l1_loss_weight: 0.0
hand_feature_chunk_size: 4
hand_feature_provider: wilor
hand_mask_bce_loss_weight: 0.0
hand_mask_dice_loss_weight: 0.0
hand_probability_loss_weight: 0.0
lingbot_enable_camera_head: true
lingbot_lr: 1.0e-05
lingbot_tune_mode: frozen
lingbotmap_ckpt: /path/to/weights/lingbot-map.pt
lingbotmap_root: /path/to/infinihand/third_party/lingbot-map
load_wilor_checkpoint: true
log_interval: 50
loss_outlier_bootstrap_steps: 1000
loss_outlier_bootstrap_threshold: 10.0
loss_outlier_multiplier: 2.0
loss_outlier_per_dataset: false
loss_outlier_window: 1000
lr: 1.0e-05
mano_random_valid_hand: true
mask_only_threshold: 0.9
max_gap: 64
max_run_steps: 0
metadata_cache_dir: /path/to/cache/metadata
min_lr: 5.0e-07
model_variant: mutual_joint_fusion
num_views: 36
num_workers: 2
output_dir: /path/to/outputs/stage2_mano
preload_manifest_root: ''
require_finetune_checkpoint: true
resume_checkpoint: ''
sampling_split_weights:
  train: 1
sampling_weights:
  ego_data_v2_sqrt_frames:
    arctic: 10
    egodemo_egopro_standard: 1
    egodemo_egostandard: 1
    h2o: 1
    hot3d: 10
    oakink2: 1
save_final_checkpoint: true
stage1_loss_weight: 1.0
step_memory_enabled: true
step_memory_max_frames: 36
step_memory_scale_frames: 4
step_memory_sliding_window: 16
train_mano_modules_only: true
train_steps: 100000
warmup_steps: 10000
weight_decay: 0.01
wilor_cfg: /path/to/infinihand/third_party/WiLoR/pretrained_models/model_config.yaml
wilor_ckpt: /path/to/weights/wilor_final.ckpt
wilor_root: /path/to/infinihand/third_party/WiLoR
