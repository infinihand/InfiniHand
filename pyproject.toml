[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinihand"
version = "1.0.0"
description = "Streaming hand and camera reconstruction: training and inference"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
infinihand-infer = "infinihand.infer:main"
infinihand-train = "infinihand.train:main"
infinihand-export = "infinihand.export_weights:main"
infinihand-evaluate = "infinihand.evaluation.camera_space:main"
infinihand-eval-report = "infinihand.evaluation.report:main"

[tool.setuptools.packages.find]
include = ["infinihand*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"infinihand.wilor" = ["LICENSE", "pretrained_models/*.yaml"]
"infinihand.lingbot_map" = ["LICENSE.txt"]
